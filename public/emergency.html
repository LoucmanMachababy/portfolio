<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auteuil — preview secours</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1a222c; overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%);
      background: rgba(0,0,0,.7); color: #e8eef6; padding: .5rem .9rem; border: 1px solid rgba(255,255,255,.2);
      font-size: .85rem; z-index: 2; pointer-events: none;
    }
    #title { position: fixed; top: 1rem; left: 1rem; color: #fff; z-index: 2; }
    #title strong { font-size: 1.4rem; letter-spacing: .08em; }
  </style>
</head>
<body>
  <div id="title"><strong>AUTEUIL</strong><div style="opacity:.7;font-size:.85rem">Preview secours · WASD + souris</div></div>
  <div id="hud">Si tu vois sol rouge + murs gris + bloc orange → WebGL OK. Puis on recharge le vrai Next.</div>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.175.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.175.0/examples/jsm/" } }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x5a6a7a);
    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 100);
    camera.position.set(0, 1.7, -1.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const L = 30, W = 7.2, H = 3.45;
    const mk = (geo, color, pos, rot) => {
      const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color }));
      if (pos) m.position.set(...pos);
      if (rot) m.rotation.set(...rot);
      scene.add(m);
      return m;
    };
    mk(new THREE.PlaneGeometry(W, L), 0xd4654a, [0, 0, -L / 2], [-Math.PI / 2, 0, 0]);
    mk(new THREE.BoxGeometry(0.55, H, L), 0xdce2ea, [W / 2, H / 2, -L / 2]);
    mk(new THREE.BoxGeometry(0.55, H, L), 0xdce2ea, [-W / 2, H / 2, -L / 2]);
    mk(new THREE.PlaneGeometry(W, L), 0xefe4d4, [0, H, -L / 2], [Math.PI / 2, 0, 0]);
    mk(new THREE.BoxGeometry(W + 1, H, 0.55), 0x4a5560, [0, H / 2, 1.6]);
    mk(new THREE.BoxGeometry(1.4, 2.0, 0.5), 0xff9900, [0, 1.1, -3.5]);
    mk(new THREE.BoxGeometry(2.2, 0.35, 0.2), 0x004170, [0, 2.4, -3.5]);
    // stands simples
    for (const [x, z] of [[2.6, -5], [-2.6, -8.5], [2.6, -12], [-2.6, -15.5], [2.6, -19], [-2.6, -22.5]]) {
      mk(new THREE.BoxGeometry(2.2, 2.4, 0.35), 0xc9a227, [x, 1.3, z]);
    }

    const controls = new PointerLockControls(camera, renderer.domElement);
    document.body.addEventListener("click", () => controls.lock());
    const keys = {};
    addEventListener("keydown", (e) => (keys[e.code] = true));
    addEventListener("keyup", (e) => (keys[e.code] = false));
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const v = new THREE.Vector3();
    function tick() {
      requestAnimationFrame(tick);
      if (controls.isLocked) {
        const speed = 0.08;
        v.set(0, 0, 0);
        if (keys.KeyW || keys.ArrowUp) controls.moveForward(speed);
        if (keys.KeyS || keys.ArrowDown) controls.moveForward(-speed);
        if (keys.KeyA || keys.ArrowLeft) controls.moveRight(-speed);
        if (keys.KeyD || keys.ArrowRight) controls.moveRight(speed);
        camera.position.y = 1.7;
        camera.position.x = THREE.MathUtils.clamp(camera.position.x, -2.5, 2.5);
        camera.position.z = THREE.MathUtils.clamp(camera.position.z, -28, -0.5);
      }
      renderer.render(scene, camera);
    }
    tick();
  </script>
</body>
</html>
